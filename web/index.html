<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finger-gun Pong</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; overflow: hidden;
               font-family: system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  video { display: none; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 18px; text-align: center; padding: 16px; background: #111; }
  #start h1 { margin: 0; font-size: clamp(32px, 7vw, 72px); }
  #start p { margin: 0; max-width: 640px; line-height: 1.5; color: #bbb; }
  #start button { font: inherit; font-size: 22px; padding: 14px 34px; border-radius: 10px; border: 0;
                  background: #46dc78; color: #111; cursor: pointer; }
  #start button:disabled { opacity: .5; cursor: default; }
  #err { color: #ff9632; min-height: 1.5em; }
  .keys { font-size: 14px; color: #888; }
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="start">
  <h1>Finger-gun Pong</h1>
  <p>Two players stand side by side in front of the camera. Your paddle is the line between your
     thumb tip and index fingertip. Left player defends the left edge, right player the right. First to 7.</p>
  <button id="go">Start camera</button>
  <div id="err"></div>
  <p class="keys">Keys: r new match · v video brightness · d hand skeletons · f fullscreen</p>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
